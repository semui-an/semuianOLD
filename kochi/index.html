<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サイト移転のお知らせ</title>

    <script>
        var newDomain = "https://semui-an.com";
    </script>

    <script>
        var canonicalLink = document.createElement('link');
        canonicalLink.rel = 'canonical';
        canonicalLink.href = newDomain + window.location.pathname + window.location.search;
        document.head.appendChild(canonicalLink);
    </script>

    <noscript>
        <meta http-equiv="refresh" content="0;url=https://semui-an.com/">
    </noscript>

    <script>
        window.location.href = newDomain + window.location.pathname + window.location.search;
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        a {
            color: #0066cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>サイト移転のお知らせ</h2>
        <p>新しいURLへ自動的に転送します。</p>
        <p>自動的に切り替わらない場合は、お手数ですが下記のリンクをクリックしてください。</p>
        <p><a id="manual-link" href="#">新サイトへ移動する</a></p>
    </div>

    <script>
        // 手動リンク用にも新ドメインのURLを設定しておく
        document.getElementById('manual-link').href = newDomain + window.location.pathname + window.location.search;
    </script>
</body>
</html>
